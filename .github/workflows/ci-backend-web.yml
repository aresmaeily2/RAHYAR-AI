name: RahyAr CI — Backend & Web Verification

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:../db/ci-test.db"
      NODE_ENV: "test"
    steps:
      - name: Checkout Exact Commit
        uses: actions/checkout@v4

      - name: Record Commit SHA Provenance
        run: |
          mkdir -p ci-artifacts
          echo "COMMIT_SHA=${{ github.sha }}" > ci-artifacts/provenance.txt
          echo "REF=${{ github.ref }}" >> ci-artifacts/provenance.txt
          echo "RUN_ID=${{ github.run_id }}" >> ci-artifacts/provenance.txt
          date -u +"RUN_UTC=%Y-%m-%dT%H:%M:%SZ" >> ci-artifacts/provenance.txt

      - name: Setup Node 22 & Bun
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun (for existing unit suite compatibility)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies (Reproducible Lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            npm install
          fi

      - name: Generate Prisma Client & Push Test Schema
        run: |
          mkdir -p db
          npx prisma generate
          npx prisma db push

      - name: Static Analysis — TypeScript Typecheck
        run: npx tsc --noEmit | tee ci-artifacts/tsc-${{ github.sha }}.log

      - name: Static Analysis — ESLint
        run: npx eslint src | tee ci-artifacts/eslint-${{ github.sha }}.log

      - name: Unit & Integration Tests
        run: |
          if grep -q '"test"' package.json; then
            bun test tests/unit 2>&1 | tee ci-artifacts/unit-tests-${{ github.sha }}.log
          fi

      - name: Dependency Vulnerability Scan (Fail on High/Critical)
        run: |
          npm audit --json > ci-artifacts/npm-audit-${{ github.sha }}.json || true
          npm audit --audit-level=high

      - name: Compute Artifact SHA-256 Hashes
        if: always()
        run: |
          cd ci-artifacts
          sha256sum * > SHA256SUMS-${{ github.sha }}.txt
          cat SHA256SUMS-${{ github.sha }}.txt

      - name: Upload Verifiable CI Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-evidence-${{ github.sha }}
          path: ci-artifacts/
          retention-days: 30
