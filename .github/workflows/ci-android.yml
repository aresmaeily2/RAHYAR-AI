name: RahyAr CI — Android Native Build & Verification (SDK 36)

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Exact Commit
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK 36 & Build-Tools 36.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Gradle Clean, Lint, JVM Unit Tests, Debug & Release Builds
        working-directory: apps/android
        run: |
          gradle clean lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify APK with aapt2, zipalign & apksigner
        run: |
          mkdir -p ci-android-artifacts
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          DEBUG_APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          REL_APK="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$DEBUG_APK" ci-android-artifacts/RahyAr-Android-v3.0.0-debug.apk
          if [ -f "$REL_APK" ]; then
            cp "$REL_APK" ci-android-artifacts/RahyAr-Android-v3.0.0-release-unsigned.apk
          fi
          echo "COMMIT_SHA=${{ github.sha }}" > ci-android-artifacts/provenance.txt
          "$BT/aapt2" dump badging ci-android-artifacts/RahyAr-Android-v3.0.0-debug.apk > ci-android-artifacts/aapt2-badging.txt
          "$BT/zipalign" -c -v 4 ci-android-artifacts/RahyAr-Android-v3.0.0-debug.apk | tail -n 5 > ci-android-artifacts/zipalign-check.txt
          "$BT/apksigner" verify --verbose --print-certs ci-android-artifacts/RahyAr-Android-v3.0.0-debug.apk > ci-android-artifacts/apksigner-verify.txt
          cat ci-android-artifacts/apksigner-verify.txt
          cd ci-android-artifacts && sha256sum * > SHA256SUMS-${{ github.sha }}.txt
          cat SHA256SUMS-${{ github.sha }}.txt

      - name: Upload Android Native APK & Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-apk-${{ github.sha }}
          path: ci-android-artifacts/
          retention-days: 30
