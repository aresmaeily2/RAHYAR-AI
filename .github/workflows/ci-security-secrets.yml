name: RahyAr CI — Secret, Binary & Policy Guard

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-and-binary-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Full History for Range Scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1 & Scan Working Tree + New Commits
        run: |
          set -euo pipefail
          mkdir -p ci-sec-artifacts /tmp/gitleaks
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks version
          /tmp/gitleaks/gitleaks detect --source . --no-git --redact --verbose --report-format json --report-path ci-sec-artifacts/gitleaks-tree.json
          /tmp/gitleaks/gitleaks git --log-opts="28b64bb0bc21e162703a59a01f6d828f8c2065d4..HEAD" --redact --verbose --report-format json --report-path ci-sec-artifacts/gitleaks-commits.json

      - name: Block Forbidden Binaries & Keystores in Tree
        run: |
          set -euo pipefail
          FORBIDDEN=$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem|key|apk|aab|zip)$|(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden sensitive/binary files tracked in Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: Zero forbidden keystores, binaries, or .env files in tracked tree."

      - name: Record Security Scan Provenance
        if: always()
        run: |
          mkdir -p ci-sec-artifacts
          echo "COMMIT_SHA=${{ github.sha }}" > ci-sec-artifacts/provenance.txt
          cd ci-sec-artifacts && sha256sum provenance.txt *.json 2>/dev/null > SHA256SUMS-${{ github.sha }}.txt || sha256sum provenance.txt > SHA256SUMS-${{ github.sha }}.txt

      - name: Upload Security Guard Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-evidence-${{ github.sha }}
          path: ci-sec-artifacts/
          retention-days: 30
