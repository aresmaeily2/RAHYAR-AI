name: RahyAr CI — Secret, Binary & Policy Guard

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-and-binary-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Full History for Scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block Forbidden Binaries & Keystores in Tree
        run: |
          FORBIDDEN=$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem|key|apk|aab|zip)$|(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden sensitive/binary files tracked in Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: Zero forbidden keystores, binaries, or .env files in tracked tree."

      - name: Record Security Scan Provenance
        if: always()
        run: |
          mkdir -p ci-sec-artifacts
          echo "COMMIT_SHA=${{ github.sha }}" > ci-sec-artifacts/provenance.txt
          sha256sum ci-sec-artifacts/provenance.txt > ci-sec-artifacts/SHA256SUMS-${{ github.sha }}.txt

      - name: Upload Security Guard Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-evidence-${{ github.sha }}
          path: ci-sec-artifacts/
          retention-days: 30
