// ماژول اپ — نسخهٔ کامل v2.0.0 (دو ویراست: user + owner)
// v2.0.0 تغییر نسبت به v1.2.0:
//  - ورودی اصلی: LoginActivity → MainActivity (محصول کامل وب روی سرور ثبت‌شده)
//  - پل بومی v2 (RahyarNative): تشخیص گفتار بومی + TTS + یادآور سیستمی (AlarmManager)
//  - حالت محلی آفلاین (HomeActivity) به‌عنوان جایگزین دوم حفظ شده است
//  - دو ویراست محصول از یک سورس واحد:
//      user  → com.rahyarai.app        «رهیار»        (versionCode 20)
//      owner → com.rahyarai.app.owner  «رهیار مالک»   (versionCode 21)
//    تفاوت نقش‌ها سمت سرور کنترل می‌شود؛ دو ویراست فقط هویت نصب/برند/پیش‌فرض
//    صفحهٔ ورود را جدا می‌کنند (بدون تکرار کد، بدون رمز تعبیه‌شده).
// امضای release عمداً پیکربندی نشده — کلید انتشار باید با تصمیم مالک ساخته شود
// (خروجی تحویلی debug-signed برای نصب آزمایشی است و صادقانه برچسب خورده).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rahyarai.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rahyarai.app'
        minSdk 24
        targetSdk 34
    }

    flavorDimensions 'edition'
    productFlavors {
        user {
            dimension 'edition'
            applicationId 'com.rahyarai.app'
            versionCode 20
            versionName '2.0.0'
            resValue 'string', 'app_name', 'رهیار'
        }
        owner {
            dimension 'edition'
            applicationId 'com.rahyarai.app.owner'
            versionCode 21
            versionName '2.0.0-owner'
            resValue 'string', 'app_name', 'رهیار مالک'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'gradle/AndroidManifest.xml'   // بدون صفت package (الزام AGP 8) — همگام با src/
            java.srcDirs = ['../src/java']
            res.srcDirs = ['../src/res']
            assets.srcDirs = ['../src/www']                 // UI محلی جایگزین — بدون هیچ منبع شبکه
        }
        // سورس مخصوص هر ویراست (EditionConfig) — ساختار مشترک با main
        user {
            java.srcDirs = ['../src/user/java']
        }
        owner {
            java.srcDirs = ['../src/owner/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signingConfig نمی‌گذاریم → خروجی release بدون امضا (app-release-unsigned.*)
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            // مسیر دارایی‌های UI برای تست OfflineContract (بدون وابستگی به دایرکتوری جاری)
            systemProperty 'rahyar.www.dir', file('../src/www').absolutePath
            // هشدارهای deprecation بومی اهمیت نتایج را تغییر نمی‌دهند
            jvmArgs '-Xmx1024m'
        }
    }
}

dependencies {
    // WebViewAssetLoader — مبدأ امن برای دارایی‌های محلی (بدون file://)
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    // نسخهٔ JVM کتابخانهٔ org.json برای تست واحد (در اجرای واقعی اپ، org.json خود پلتفرم استفاده می‌شود)
    testImplementation 'org.json:json:20240303'
}
